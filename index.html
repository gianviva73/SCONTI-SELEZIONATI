function closeAdmin(){document.getElementById('adminPanel').style.display='none';window.scrollTo({top:0,behavior:'smooth'});}
function toggleCat(name){OPEN=(OPEN===name)?'':name; render();}

function render(){
 let html='';
 CATS.forEach(c=>{
  let isOpen=OPEN===c.name;
  let subList=SUBS[c.name]||[];
  let filledCount=subList.filter(s=>prods.some(p=>p.cat===c.name && p.sub===s.n && p.url)).length;
  
  html+=`<div class="catRow ${isOpen?'catOpen':''}" onclick="toggleCat('${c.name.replace(/'/g,"")}')"><div class="catIcon">${c.icon}</div><div class="catName">${T(c.name)} <span style="color:#888;font-size:13px">(${filledCount}/${subList.length})</span></div><div class="catArrow">⌄</div></div>`;
  
  if(isOpen){
   html+=`<div class="prodList">`+subList.map(s=>{
     let linkProd=prods.find(pp=>pp && pp.cat===c.name && pp.sub===s.n && pp.url);
     if(linkProd){
       return `<a href="${linkProd.url}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid #eee;text-decoration:none;color:#111;background:#fff"><span style="font-size:22px">${s.i}</span><span style="flex:1;font-size:16px">${T(s.n)}</span><span style="color:#ff5a00;font-weight:800">Apri ↗</span></a>`;
     } else {
       return `<div style="display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid #eee;background:#fff"><span style="font-size:22px">${s.i}</span><span style="flex:1;font-size:16px">${T(s.n)}</span><span style="color:#999;font-size:12px">Link da inserire</span></div>`;
     }
   }).join('')+`</div>`;
  }
 });
 document.getElementById('catsList').innerHTML=html; 
}

function updateSubCats(){
  let cat=document.getElementById('aCat').value;
  let subSel=document.getElementById('aSub');
  let subs=SUBS[cat]||[];
  subSel.innerHTML=subs.map(s=>`<option value="${s.n}">${s.i} ${s.n}</option>`).join('');
}

function saveProd(){
  let cat=document.getElementById('aCatè').value;
  let sub=document.getElementById('aSub').value;
  let url=document.getElementById('aUrl').value.trim();
  if(!url){alert('Inserisci il link!');return;}
  prods=prods.filter(pp=>!(pp.cat===cat&&pp.sub===sub));
  prods.unshift({cat, sub, url, isLink:true});
  render();
  document.getElementById('adminNow').textContent='✅ Salvato: ' + cat + ' -> ' + sub;
  document.getElementById('aUrl').value='';
}

let sel=document.getElementById('aCat'); 
sel.innerHTML=CATS.map(c=>`<option>${c.name}</option>`).join('');

});
